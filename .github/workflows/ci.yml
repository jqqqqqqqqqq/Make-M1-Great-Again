name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Apple Silicon runner: this project targets arm64 Macs only, since the
    # DCP and IOAVServiceSetVirtualEDIDMode do not exist on Intel.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          swift --version
          python3 --version
          uname -m

      - name: Test the timing generator
        run: python3 tests/test_apple_edid.py

      - name: Build avedid
        run: |
          mkdir -p build
          swiftc -O -target arm64-apple-macos12 -o build/avedid avedid.swift

      - name: Smoke-test the binary
        # No display is attached to a CI runner, so only --help can run. Anything
        # touching IOKit is expected to fail here and is covered by the notes in
        # the README instead.
        run: |
          ./build/avedid help
          file build/avedid

      - name: Check shell scripts parse
        run: |
          for f in install.sh uninstall.sh install-agent.sh uninstall-agent.sh; do
            bash -n "$f" && echo "ok $f"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: avedid-arm64
          path: build/avedid
          if-no-files-found: error

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build release binary
        run: |
          mkdir -p build
          swiftc -O -target arm64-apple-macos12 -o build/avedid avedid.swift

      - name: Package
        run: |
          cd build
          tar -czf "avedid-${GITHUB_REF_NAME}-arm64.tar.gz" avedid
          shasum -a 256 "avedid-${GITHUB_REF_NAME}-arm64.tar.gz" \
            > "avedid-${GITHUB_REF_NAME}-arm64.tar.gz.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/avedid-*-arm64.tar.gz
            build/avedid-*-arm64.tar.gz.sha256
          generate_release_notes: true
          body: |
            Apple Silicon (arm64) build of `avedid`.

            The binary is unsigned, so macOS Gatekeeper will quarantine a
            downloaded copy. Either clear it:

                xattr -d com.apple.quarantine avedid

            or just build from source, which takes a second:

                swiftc -O -o build/avedid avedid.swift
